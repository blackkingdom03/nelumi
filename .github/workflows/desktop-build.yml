name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease after all five builds pass
        type: boolean
        default: false
      reuse_run:
        description: Optional run ID whose five build jobs already passed (publication-only corrections)
        type: string
        default: ''
  push:
    tags: ['v*-beta.*']

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: ${{ !inputs.reuse_run }}
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { os: windows-2022, platform: win, arch: x64 }
          - { os: windows-11-arm, platform: win, arch: arm64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: ubuntu-22.04, platform: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libfuse2 fonts-noto-cjk
      - name: Build packages
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify packaged app (Windows and Mac)
        if: runner.os != 'Linux'
        run: node scripts/release-smoke.cjs ${{ matrix.arch }}
      - name: Verify packaged app (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/release-smoke.cjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: nelumi-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb

  release:
    if: ${{ always() && !cancelled() && (startsWith(github.ref, 'refs/tags/') || inputs.publish == true) && (needs.build.result == 'success' || inputs.reuse_run) }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.reuse_run || github.run_id }}
        run: node scripts/verify-build-run.cjs
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
          pattern: nelumi-*
      - name: Verify package count and calculate checksums
        run: |
          node scripts/verify-release.cjs packages
          cd packages
          sha256sum * > SHA256SUMS.txt
      - name: Publish desktop preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          case "$TAG" in *-beta.*) ;; *) echo "Only beta releases are allowed"; exit 1 ;; esac
          gh release create "$TAG" packages/* --target "$GITHUB_SHA" --prerelease --title "nelumi $TAG · 多平台测试版" --notes-file docs/releases/0.6.0-beta.1.md
